name: Update Gas Data

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate latest gas data
        run: python3 scripts/fetch-l1beat-gas-report.py > data/latest.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "Update gas report data"
          git push
